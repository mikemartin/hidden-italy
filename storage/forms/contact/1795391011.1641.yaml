message_body: |-
  Hi there,  Hidden Italy has been recommended by David, a fellow member of the Maroondah Bushwalking Club, Victoria.
  My husband and I are interested in doing a walk in the Dolomites before we enjoy a cruise departing from Venice on 17th October 2027.  I am sensing after checking a variety of departure dates that early to mid October might be a bit late in the season.  We are experienced hikers however now in our 70s are looking for an appropriate hike to see the Dolomites.
  Do you have any suggestions?
  thanks in anticipation
  Judi Wicking
