message_body: |-
  Hi Hidden Italy team,

  I came across your "Sardinia in the Spring" tour and wanted to reach out directly. I'm Davide Fancellu, owner of Travel Planner Family, a licensed DMC based in Alghero, Sardinia. With our brand DRAN Experience we run private experiences across the island, including a Blue Zone Tour, a Longevity Pasta Class and boat days in the Gulf of Orosei. We can support your next departures on the ground and add private experiences your walkers will remember.

  With Sardinia on Signature's "Where to Go 2027" list, interest in the island keeps growing among travelers who already know Rome and Tuscany.

  Would it be useful if I sent you a one-page proposal for your next departures?
  Best regards,
  Davide Fancellu
