message_body: "My wife and I are thinking of doing a short self guided walking tour in Italy in April 2027. We live in Bondi, are in our late 60s and fit, but have not done walking tours before. We'd appreciate your advice on which tour to take. We have been to Tuscany and Chianti, and are happy to return, but had thought about visiting Pulgia. However, the Pulgia walk (one at  6 hrs) may be a bit much. Also it seems like Tuscany will be greener and not as dry as Pulgia. Many thanks Michael"
