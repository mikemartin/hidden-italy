message_body: |-
  For the Camino of St Francis Part 1 / 2 / 3 self guided walk from Assisi to Rome, is it posibble to obtain a list of the villages where one would stay each night. The Itineraries give daily walked distance + elevations, yet no mention of the from/ to villages. 

  Looking at the St Francis web site they indicate that a typical itinerary would be Assisi to Spello to Trevi to Poreta to Spoleto to Ceselli to Piediluco to Poggio Bustone to Rieti to Poggio San Lorenzo to Ponticelli to Monterotondo to Monte Sarco to Rome & we were wondering if the Hidden Italy walk uses these villages for o-nite stays.

  Thanks in advance
