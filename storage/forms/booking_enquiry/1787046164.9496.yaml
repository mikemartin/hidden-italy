message_body: |-
  Hi,

  I am thinking of doing this hike in the first week of April in 2027.  Could you please help me with the following questions.
  Can you please provide an itinerary that names the villages we visit each day.
  Can you also provide a map of the walk.
  Are you also able to provide an image that shows a profile of the walk each day showing distance and altitude.  If not, could you please indicate what altitudes are reached each day?
  Does the hike include any altitude which will make hiking difficult at this time of year due to either wind, cold or rain?

  Thank you.

  Andrew
